# Development/test only. Ports match scripts/dev-services.mjs so .env works with either.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: netflex
      POSTGRES_PASSWORD: netflex-dev-only
      POSTGRES_DB: netflex_dev
    ports: ['127.0.0.1:54329:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netflex']
      interval: 5s
      retries: 10
  redis:
    image: redis:7.2.17
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:63799:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
